name: CI (Docs)

on:
  pull_request:
    paths:
      - 'website/**'
      - 'types/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.npmrc'
      - '.nvmrc'
      - '.github/workflows/ci-docs.yml'
      - 'benchmarks/history/**'
      - 'scripts/measure-feature-costs.mjs'
      - 'scripts/release-size-manifest.mjs'
      - 'scripts/test/slim-metrics.test.mjs'

jobs:
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
    - name: Install pnpm
      run: npm install -g "$(node -p 'require("./package.json").packageManager')"
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Test slim metrics
      run: node --test scripts/test/slim-metrics.test.mjs
    - name: Check slim metrics
      run: node website/scripts/generate-slim-metrics.mjs --check
    - name: Build the docs
      run: pnpm run docs
